function createProgressBar(current,total){


    let percent = 0;


    if(total > 0){

        percent =
        Math.round(
            (current / total) * 100
        );

    }



    return `


        <div class="progress-container">


            <div

                class="progress-bar"

                style="width:${percent}%"

            >

            </div>


        </div>



        <small>

            ${percent}% Complete

        </small>


    `;


}

/* ==========================================================
   OPERATIONAL PRIORITY ENGINE
========================================================== */


function generateOperationalPriorities(){


    let priorities = [];



    const truckBoxes =
        ASM_STATE.truck.boxes;


    const truckProcessed =
        ASM_STATE.truck.processed;



    let truckCompletion = 0;



    if(truckBoxes > 0){

        truckCompletion =
            Math.round(
                (truckProcessed / truckBoxes) * 100
            );

    }





    if(
        ASM_STATE.incidents.length > 0
    ){

        priorities.push({

            level:"HIGH",

            message:
            `🚨 ${ASM_STATE.incidents.length} incident(s) require review`

        });

    }





    if(
        truckBoxes > 0
        &&
        truckCompletion < 100
    ){

        priorities.push({

            level:"MEDIUM",

            message:
            `🚚 Truck processing ${truckCompletion}% complete`

        });

    }





    if(
        ASM_STATE.sales.salesPace < 80
        &&
        ASM_STATE.sales.dailyGoal > 0
    ){

        priorities.push({

            level:"MEDIUM",

            message:
            `💰 Sales pace below target (${ASM_STATE.sales.salesPace}%)`

        });

    }





    const incompleteTasks =

        ASM_STATE.tasks.filter(

            task => !task.complete

        ).length;




    if(
        incompleteTasks > 0
    ){

        priorities.push({

            level:"LOW",

            message:
            `✅ ${incompleteTasks} daily task(s) remaining`

        });

    }





    if(
        priorities.length === 0
    ){

        priorities.push({

            level:"GOOD",

            message:
            "🟢 Operations running normally"

        });

    }



    return priorities;


}

/* ==========================================================
   PATTERN RECOGNITION ENGINE
========================================================== */


function generateOperationalPatterns(){


    let patterns = [];



    const history =
        ASM_STATE.shiftHistory;



    const decisions =
        ASM_STATE.decisions;



    if(history.length === 0){

        return patterns;

    }



    const lowReadinessShifts =

        history.filter(

            shift =>
            shift.readinessScore < 50

        ).length;



    if(
        lowReadinessShifts >= 3
    ){

        patterns.push({

            category:
            "READINESS TREND",


            priority:
            "MEDIUM",


            pattern:

            "Multiple shifts have recorded below-target readiness.",


            recommendation:

            "Review checklist completion consistency."

        });

    }




    const salesRiskCount =

        decisions.filter(

            decision =>

            decision.recommendation
            .toLowerCase()
            .includes("sales")

        ).length;



    if(
        salesRiskCount >= 2
    ){

        patterns.push({

            category:
            "SALES TREND",


            priority:
            "HIGH",


            pattern:

            "Sales improvement actions have been required repeatedly.",


            recommendation:

            "Analyze floor coverage and customer engagement patterns."

        });

    }




    return patterns;


}


/* ==========================================================
   ADAPTIVE RECOMMENDATION ENGINE v2
========================================================== */


function generateAdaptiveRecommendationsV2(){


    let recommendations = [];


    const experiences =
        ASM_STATE.experienceLibrary || [];



    experiences.forEach(
        experience => {



            if(
                experience.category === "SALES"
                &&
                ASM_STATE.sales.salesPace < 80
            ){



                recommendations.push({

                    priority:
                    "HIGH",


                    category:
                    "SALES MEMORY",


                    problem:
                    experience.problem,


                    recommendation:
                    experience.successfulAction,


                    confidence:
                    experience.confidence || 0,


                    reason:

                    `Previously used ${experience.timesUsed} time(s) with ${experience.confidence}% confidence.`


                });


            }



        }
    );



    return recommendations;


}

/* ==========================================================
   EXPERIENCE BASED RECOMMENDATIONS
========================================================== */


function generateExperienceRecommendations(){


    let recommendations = [];


    if(
        !ASM_STATE.experienceLibrary ||
        ASM_STATE.experienceLibrary.length === 0
    ){

        return recommendations;

    }



    ASM_STATE.experienceLibrary.forEach(
        item => {


            if(item.confidence >= 60){


                recommendations.push({

                    category:
                    item.category,


                    problem:
                    item.problem,


                    recommendation:
                    item.successfulAction,


                    confidence:
                    item.confidence,


                    timesUsed:
                    item.timesUsed,


                    reason:
                    "Previously successful action used "
                    +
                    item.timesUsed
                    +
                    " time(s) with "
                    +
                    item.confidence
                    +
                    "% confidence."

                });


            }


        }
    );



    recommendations.sort(
        (a,b)=>
        b.confidence - a.confidence
    );



    return recommendations;


}

/* ==========================================================
   DECISION OUTCOME LEARNING ENGINE
========================================================== */


function evaluateDecisionOutcomes(){


    let results = [];



    ASM_STATE.decisions.forEach(

        decision => {



            let readinessBefore =
                decision.readinessBefore || 0;



            let readinessAfter =
                decision.readinessAfter || 0;



            let salesBefore =
                decision.salesBefore || 0;



            let salesAfter =
                decision.salesAfter || 0;



            let readinessChange =
                readinessAfter - readinessBefore;



            let salesChange =
                salesAfter - salesBefore;



            let effectiveness =
                "NEUTRAL";



            if(
                readinessChange > 0
                ||
                salesChange > 0
            ){

                effectiveness =
                "POSITIVE";

            }



            if(
                readinessChange < 0
                &&
                salesChange < 0
            ){

                effectiveness =
                "NEGATIVE";

            }



            results.push({

                id:
                decision.id,


                action:
                decision.action,


                effectiveness:
                effectiveness,


                readinessChange:
                readinessChange,


                salesChange:
                salesChange



            });



        }

    );



    ASM_STATE.decisionResults =
        results;



    saveASMState();



    return results;


}

/* ==========================================================
   EXPERIENCE LEARNING ENGINE
========================================================== */


function learnFromDecisionOutcomes(){


    const results =
        ASM_STATE.decisionResults || [];



    results.forEach(result => {



        const decision =
            ASM_STATE.decisions.find(
                d => d.id === result.id
            );



        if(!decision){
            return;
        }



        let effectiveness =
            result.effectiveness;



        if(effectiveness === "POSITIVE"){



            const existing =
                ASM_STATE.experienceLibrary.find(
                    item =>
                    item.problem === decision.recommendation
                );



            if(existing){


                existing.timesUsed += 1;


                existing.confidence =
                    Math.min(
                        95,
                        existing.confidence + 5
                    );


            }


            else{


                ASM_STATE.experienceLibrary.push(
                {

                    id:
                    Date.now(),


                    category:
                    "OPERATIONS",


                    problem:
                    decision.recommendation,


                    successfulAction:
                    decision.action,


                    effectiveness:
                    "POSITIVE",


                    timesUsed:
                    1,


                    confidence:
                    60


                });


            }


        }


    });



    saveASMState();



    return ASM_STATE.experienceLibrary;


}
/* ==========================================================
   SHIFT INTELLIGENCE ENGINE
========================================================== */


function generateShiftIntelligence(){


    let insights = [];



    const hour =
        new Date().getHours();



    const salesPace =
        ASM_STATE.sales.salesPace;



    const truckBoxes =
        ASM_STATE.truck.boxes;


    const truckProcessed =
        ASM_STATE.truck.processed;



    let truckCompletion = 0;



    if(truckBoxes > 0){

        truckCompletion =
            Math.round(
                (truckProcessed / truckBoxes) * 100
            );

    }





    /*
       SALES ANALYSIS
    */


    if(
        salesPace < 80
        &&
        ASM_STATE.sales.dailyGoal > 0
    ){

        insights.push({

            type:
            "SALES",

            message:
            "Sales pace is below target. Focus on floor conditions, customer engagement, and recovery."

        });

    }





    /*
       TRUCK ANALYSIS
    */


    if(
        truckBoxes > 0
        &&
        truckCompletion < 100
    ){

        insights.push({

            type:
            "FREIGHT",

            message:
            `Freight completion is ${truckCompletion}%. Continue processing priorities.`

        });

    }





    /*
       TASK ANALYSIS
    */


    const remainingTasks =

        ASM_STATE.tasks.filter(

            task => !task.complete

        ).length;




    if(
        remainingTasks > 0
    ){

        insights.push({

            type:
            "TASKS",

            message:
            `${remainingTasks} ASM task(s) remain incomplete.`

        });

    }





    /*
       TIME AWARENESS
    */


    if(
        hour >= 17
    ){

        insights.push({

            type:
            "SHIFT",

            message:
            "Evening shift detected. Begin preparing closing priorities."

        });

    }



    if(
        hour < 10
    ){

        insights.push({

            type:
            "SHIFT",

            message:
            "Opening period detected. Prioritize readiness and customer experience."

        });

    }





    if(
        insights.length === 0
    ){

        insights.push({

            type:
            "STATUS",

            message:
            "Operations appear balanced."

        });

    }



    return insights;


}


/* ==========================================================
   SHIFT PHASE ENGINE
========================================================== */


function getCurrentShiftPhase(){


    const hour =
        new Date().getHours();



    if(hour < 12){

        return "🌅 Opening";

    }


    if(hour < 17){

        return "☀️ Mid Shift";

    }


    return "🌙 Closing";


}

/* ==========================================================
   SHIFT ANALYTICS ENGINE
========================================================== */


function generateShiftAnalytics(){


    const history =
        ASM_STATE.shiftHistory;



    if(history.length === 0){

        return {

            totalShifts:0,

            averageReadiness:0,

            averageSalesPace:0,

            averageIncidents:0,

            commonIssues:[]

        };

    }



    const totalShifts =
        history.length;



    const averageReadiness = Math.round(

        history.reduce(

            (sum, shift) =>
            sum + shift.readinessScore,

            0

        )

        /

        totalShifts

    );



    const averageIncidents = Math.round(

        history.reduce(

            (sum, shift) =>
            sum + shift.incidents,

            0

        )

        /

        totalShifts

    );



    const salesPaces = history.map(
        shift => {


            const values =
                shift.sales.split(" / ");



            if(
                Number(values[1]) > 0
            ){

                return Math.round(

                    (

                    Number(values[0])

                    /

                    Number(values[1])

                    )

                    *

                    100

                );

            }


            return 0;


        }

    );



    const averageSalesPace = Math.round(

        salesPaces.reduce(

            (a,b)=>a+b,

            0

        )

        /

        salesPaces.length

    );



    let commonIssues = [];



    history.forEach(shift => {


        if(
            shift.incidents > 0
        ){

            commonIssues.push(
                "Incidents recorded"
            );

        }


        if(
            shift.notes > 0
        ){

            commonIssues.push(
                "Manager notes created"
            );

        }


    });



    return {


        totalShifts,

        averageReadiness,

        averageSalesPace,

        averageIncidents,

        commonIssues


    };


}


/* ==========================================================

========================================================== */


function generateManagerAssistant(){


    let recommendations = [];



    const salesPace =
        ASM_STATE.sales.salesPace;



    const truck =
        ASM_STATE.truck;



    const incompleteTasks =

        ASM_STATE.tasks.filter(

            task => !task.complete

        ).length;



    const incidents =
        ASM_STATE.incidents.length;



    const analytics =
        generateShiftAnalytics();




    /*

    */


    if(salesPace < 80){


        recommendations.push({


            type:

            priority:
            "HIGH",


            message:

            "Sales pace is below target. Increase floor engagement, recovery, and customer interaction."


        });


    }




    /*
        FREIGHT INTELLIGENCE
    */


    if(
        truck.boxes > 0
        &&
        truck.processed < truck.boxes
    ){


        const remaining =

            truck.boxes -

        recommendations.push({


            type:
            "FREIGHT",


            priority:
            "MEDIUM",


            message:

            `Freight remaining: ${remaining} boxes. Prioritize processing before shift transition.`


        });


    }





    /*

    */


    if(
        incompleteTasks > 0
    ){


        recommendations.push({


            type:
            "TASKS",


            priority:
            "LOW",


            message:

            `${incompleteTasks} ASM task(s) remain incomplete. Complete before handoff.`


        });


    }




    /*
        INCIDENT INTELLIGENCE
    */


    if(
        incidents > 0
    ){


        recommendations.push({


            type:
            "SAFETY",


            priority:
            "HIGH",


            message:

            `${incidents} incident(s) recorded. Review corrective actions before closeout.`


        });


    }





    /*

    */


    if(
        analytics.totalShifts > 0
        &&
        analytics.averageReadiness < 50
    ){


        recommendations.push({


            type:
            "HISTORY",


            priority:
            "MEDIUM",


            message:

            "Recent shift history shows below-target readiness. Focus on consistent checklist completion."


        });


    }



    return recommendations;


}


/* ==========================================================
   EXPERIENCE MEMORY BUILDER
========================================================== */


function buildExperienceLibrary(){


    if(
        !ASM_STATE.decisionResults ||
        ASM_STATE.decisionResults.length === 0
    ){

        return [];

    }



    ASM_STATE.decisionResults.forEach(result => {



        if(
            result.effectiveness === "POSITIVE"
        ){


            const exists =

            ASM_STATE.experienceLibrary.some(

                item =>
                item.id === result.id

            );



            if(!exists){


                ASM_STATE.experienceLibrary.push(

                    {

                        id:
                        result.id,


                        category:
                        "OPERATIONAL",


                        problem:
                        "Previous shift issue",


                        successfulAction:
                        result.action,


                        effectiveness:
                        result.effectiveness,


                        confidence:
                        25,


                        timesUsed:
                        1,


                        createdAt:
                        new Date().toLocaleString()


                    }

                );


            }


        }


    });



    saveASMState();



    return ASM_STATE.experienceLibrary;


}


/* ==========================================================
   EXPERIENCE USAGE TRACKER
========================================================== */


function updateExperienceConfidence(){


    ASM_STATE.experienceLibrary.forEach(
        
        item => {


            item.confidence =

            calculateExperienceConfidence(
                item
            );


        }

    );


    saveASMState();


    return ASM_STATE.experienceLibrary;


}


/* ==========================================================
   EXPERIENCE CONFIDENCE ENGINE
========================================================== */


function calculateExperienceConfidence(
    experience
){


    let confidence = 0;



    if(
        experience.timesUsed >= 1
    ){

        confidence += 25;

    }



    if(
        experience.timesUsed >= 3
    ){

        confidence += 25;

    }



    if(
        experience.timesUsed >= 5
    ){

        confidence += 25;

    }



    if(
        experience.timesUsed >= 10
    ){

        confidence += 25;

    }



    return confidence;


}

function showScreen(screen){

    currentScreen = screen;


    const screenArea =
        document.getElementById("screen");


    if(!screenArea){
        return;
    }



    switch(screen){
    
    
        case "dashboard":
    
            screenArea.innerHTML =
                renderDashboard();
    
            break;
    
    
    
        case "history":
    
            screenArea.innerHTML =
                renderHistory();
    
            break;
    
    
    
        case "opening":
    
            screenArea.innerHTML =
                renderOpening();
    
            break;
    
    
    
        case "closing":
    
            screenArea.innerHTML =
                renderClosing();
    
            break;



        case "tasks":

            screenArea.innerHTML =
                renderTasks();

            break;
            


        case "sales":

            screenArea.innerHTML =
                renderSales();
        
            break;

        
        case "truck":

            screenArea.innerHTML =
                renderTruck();

            break;



        case "notes":

            screenArea.innerHTML =
                renderNotes();

            break;



        case "tools":

            screenArea.innerHTML =
                renderTools();

            break;

            
        case "handoff":

            screenArea.innerHTML =
                renderHandoff();

            break;

            
        case "incidents":

            screenArea.innerHTML =
                renderIncidents();

            break;

            
        case "history":

            screenArea.innerHTML =
                renderHistory();
        
            break;



        default:

            screenArea.innerHTML =
            `
                <h2>
                    Screen Not Found
                </h2>
            `;

    }

}
    
function addHandoff(event){


    event.preventDefault();



    const message =
        document.getElementById(
            "handoff-message"
        ).value;



    const category =
        document.getElementById(
            "handoff-category"
        ).value;



    if(!message.trim()){

        return;

    }



    ASM_STATE.handoffs.push({


        id:
        Date.now(),


        category:
        category,


        message:
        message,


        created:
        new Date().toLocaleString()


    });



    saveASMState();



    showScreen("handoff");


}

========================================================== */


function toggleOpeningTask(id){


    const task =
        ASM_STATE.openingChecklist.find(
            item => item.id === id
        );



    if(task){

        task.complete =
            !task.complete;

    }



    const allComplete =
        ASM_STATE.openingChecklist.every(
            item => item.complete
        );



    ASM_STATE.daily.openingComplete =
        allComplete;



    saveASMState();



    showScreen("opening");

}

   CLOSING CHECKLIST CONTROLLER

    const task =

        );



    if(task){

        task.complete =
            !task.complete;

    }



    const allComplete =
        ASM_STATE.closingChecklist.every(
            item => item.complete
        );



    ASM_STATE.daily.closingComplete =
        allComplete;

}

function toggleTask(id){


    const task =
        ASM_STATE.tasks.find(
            item => item.id === id
        );



    if(task){


        task.complete =
            !task.complete;



        if(task.complete){

            task.completedAt =
                new Date().toLocaleString();

        }

        else{

            task.completedAt =
                null;

        }

    }



    saveASMState();


    showScreen("tasks");


}

    if(!description){


        alert(
            "Incident description cannot be empty."
        );


        return;

    }


    const newIncident = {


        id:
        Date.now(),


        category:
        category,


        severity:
        severity,


        description:
        description,


        created:
        new Date().toLocaleString()


    };



    ASM_STATE.incidents.push(newIncident);



    saveASMState();



    showScreen("incidents");


}


/* ==========================================================
   SALES CONTROLLER
========================================================== */


function updateSales(event){


    event.preventDefault();



    const salesInput =
        document.getElementById(
            "sales-current"
        ).value;



    const transactionInput =
        document.getElementById(
            "sales-transactions"
        ).value;



    ASM_STATE.sales.currentSales =
        parseFloat(
            salesInput
        ) || 0;



    ASM_STATE.sales.transactions =
        parseInt(
            transactionInput
        ) || 0;




    if(
        ASM_STATE.sales.transactions > 0
    ){

        ASM_STATE.sales.averageTicket =

            ASM_STATE.sales.currentSales

            /

            ASM_STATE.sales.transactions;


    } else {


        ASM_STATE.sales.averageTicket = 0;


    }




    if(
        ASM_STATE.sales.dailyGoal > 0
    ){

        ASM_STATE.sales.salesPace =

            Math.round(

                (

                    ASM_STATE.sales.currentSales

                    /

                    ASM_STATE.sales.dailyGoal

                )

                *

                100

            );


    } else {


        ASM_STATE.sales.salesPace = 0;


    }




    ASM_STATE.sales.lastUpdated =

        new Date().toLocaleString();




    saveASMState();



    showScreen("sales");


}


/* ==========================================================
   MANAGER DECISION MEMORY CONTROLLER
========================================================== */


function saveManagerDecision(){


    const recommendation =
        document.getElementById(
            "decision-recommendation"
        ).value.trim();



    const action =
        document.getElementById(
            "decision-action"
        ).value.trim();



    const outcome =
        document.getElementById(
            "decision-outcome"
        ).value.trim();



    if(!action){

        alert(
            "Please enter the action taken."
        );

        return;

    }



    const decision = {


        id:
        Date.now(),


        date:
        new Date().toLocaleString(),


        recommendation:
        recommendation,


        action:
        action,


        outcome:
        outcome || "No outcome recorded",


        manager:
        ASM_STATE.currentUser


    };



    ASM_STATE.decisions.push(
        decision
    );



    saveASMState();



    showScreen("dashboard");


}


/* ==========================================================
   TRUCK CONTROLLER
========================================================== */


function updateTruck(event){


    event.preventDefault();



    const boxesInput =
        document.getElementById(
            "truck-boxes"
        ).value;



    const processedInput =
        document.getElementById(
            "truck-processed"
        ).value;



    ASM_STATE.truck.boxes =

        parseInt(
            boxesInput
        ) || 0;



    ASM_STATE.truck.processed =

        parseInt(
            processedInput
        ) || 0;



    if(
        ASM_STATE.truck.boxes > 0
    ){

        ASM_STATE.truck.completed =

            ASM_STATE.truck.processed >=
            ASM_STATE.truck.boxes;


    }



    ASM_STATE.truck.status =

        ASM_STATE.truck.completed

        ?

        "Complete"

        :

        "In Progress";



    saveASMState();



    showScreen("truck");


}


/* ==========================================================
   CLOSE SHIFT CONTROLLER
========================================================== */


function closeShift(){


    const closeout =
        generateShiftCloseout();



    const handoff =
        generateAutomaticHandoff();



    const record = {


        id:
        Date.now(),



        closedBy:
        ASM_STATE.currentUser,



        closedAt:
        new Date().toLocaleString(),



        readinessScore:
        renderCurrentReadinessScore(),



        sales:
        closeout.sales,



        truck:
        closeout.truck,



        notes:
        closeout.notes,



        incidents:
        closeout.incidents,



        incompleteTasks:
        closeout.incompleteTasks,



        handoff:
        handoff



    };



    ASM_STATE.closeouts.push(record);



    saveASMState();



    alert(
        "Shift Closed Successfully"
    );


}


/* ==========================================================
   HANDOFF ACCEPTANCE CONTROLLER
========================================================== */


function acceptHandoff(){


    ASM_STATE.shift.handoffAccepted =
        true;


    ASM_STATE.shift.receivingManager =
        ASM_STATE.currentUser;


    saveASMState();


    showScreen("dashboard");


}


/* ==========================================================
   SHIFT ARCHIVE ENGINE
========================================================== */


function archiveClosedShift(){


    const archiveRecord = {


        id:
        Date.now(),


        date:
        new Date().toLocaleDateString(),


        openedAt:
        ASM_STATE.shift.openedAt,


        closedAt:
        ASM_STATE.shift.closedAt,


        openedBy:
        ASM_STATE.shift.openedBy,


        closedBy:
        ASM_STATE.shift.closedBy,


        readinessScore:
        renderCurrentReadinessScore(),


        sales:
        `${ASM_STATE.sales.currentSales} / ${ASM_STATE.sales.dailyGoal}`,


        truck:
        `${ASM_STATE.truck.processed} / ${ASM_STATE.truck.boxes} boxes`,


        notes:
        ASM_STATE.notes.length,


        incidents:
        ASM_STATE.incidents.length,


        handoffAccepted:
        ASM_STATE.shift.handoffAccepted


    };



    ASM_STATE.shiftHistory.push(
        archiveRecord
    );


}

/* ==========================================================
   SHIFT LIFECYCLE CONTROLLER
========================================================== */


function openShift(){


    ASM_STATE.shift.status =
        "ACTIVE";


    ASM_STATE.shift.openedAt =
        new Date().toLocaleString();


    ASM_STATE.shift.openedBy =
        ASM_STATE.currentUser;


    ASM_STATE.shift.closedAt =
        null;


    ASM_STATE.shift.closedBy =
        null;


    ASM_STATE.shift.receivingManager =
        null;


    ASM_STATE.shift.handoffAccepted =
        false;



    saveASMState();


    showScreen("dashboard");


}



function closeActiveShift(){


    ASM_STATE.shift.status =
        "CLOSED";


    ASM_STATE.shift.closedAt =
        new Date().toLocaleString();


    ASM_STATE.shift.closedBy =
        ASM_STATE.currentUser;

    archiveClosedShift();

    ASM_STATE.shift.handoffCreatedAt =
    new Date().toLocaleString();


    ASM_STATE.shift.handoffFrom =
    ASM_STATE.currentUser;



    closeShift();


    saveASMState();


    showScreen("dashboard");


}
/* ==========================================================
   APPLICATION STARTUP
========================================================== */


loadASMState();


showScreen("dashboard");
</script>
